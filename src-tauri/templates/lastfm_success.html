<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeMusic — Connected</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #09090b;
    color: #fafafa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    text-align: center;
    padding: 48px 40px;
    border-radius: 16px;
    background: #18181b;
    border: 1px solid #27272a;
    max-width: 380px;
    width: 90%;
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, #d51007, #ff4d4d);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 28px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  p {
    font-size: 14px;
    color: #a1a1aa;
    line-height: 1.6;
  }
  .note {
    margin-top: 20px;
    font-size: 12px;
    color: #52525b;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon">&#10003;</div>
  <h1>Connected to Last.fm</h1>
  <p>Your Last.fm account has been linked to VibeMusic.<br>Scrobbling is now active.</p>
  <p class="note">You can close this window and return to the app.</p>
</div>
</body>
</html>
