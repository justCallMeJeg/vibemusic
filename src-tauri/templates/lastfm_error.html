<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeMusic — Error</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: oklch(14.5% 0 0deg);
    color: oklch(98.5% 0 0deg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  main {
    text-align: center;
    padding: 48px 40px;
    border-radius: 14px;
    background: oklch(14.5% 0 0deg);
    border: 1px solid oklch(26.9% 0 0deg);
    max-width: 380px;
    width: 90%;
  }
  .icon {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: oklch(26.9% 0 0deg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 28px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
    color: oklch(98.5% 0 0deg);
  }
  p {
    font-size: 14px;
    color: oklch(70.8% 0 0deg);
    line-height: 1.6;
  }
  .note {
    margin-top: 20px;
    font-size: 12px;
    color: oklch(70.8% 0 0deg);
  }
</style>
</head>
<body>
<main role="alert" aria-live="assertive">
  <div class="icon" aria-label="Error" role="img">&#10007;</div>
  <h1>Authorization Failed</h1>
  <p>No valid token was received from Last.fm.<br>Close this tab, then click <strong>Connect Last.fm</strong> in VibeMusic settings to try again.</p>
  <p class="note">Close this tab and return to VibeMusic.</p>
</main>
</body>
</html>
